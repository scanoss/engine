---
name: "tagged-release"

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  tagged-release:
    name: "Tagged Release"
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Install third party dependencies
        run: sudo apt update && sudo apt install -y build-essential zlib1g-dev libsqlite3-dev libz-dev curl gem ruby unzip p7zip-full unrar-free git libgcrypt-dev

      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Git Clone LDB
        uses: actions/checkout@v3
        with:
          repository: scanoss/ldb
          # This branch requires the CRC64 release line of LDB (5.x-crc64).
          ref: crc64
          path: ldb
          fetch-depth: 0

      - name: Build & Install ldb
        # Pick the latest tag of the CRC64 line specifically. Both LDB release
        # lines are tagged in the same repository, so "the newest tag" may well
        # be a 4.x one from the traditional line.
        run: |
          cd ldb
          ldb_tag=$(git tag --list 'v*-crc64' --sort=-v:refname | head -1)
          if [ -z "$ldb_tag" ] ; then echo "No -crc64 tag found in scanoss/ldb" >&2 ; exit 1 ; fi
          echo "Building LDB $ldb_tag"
          git checkout "$ldb_tag"
          make all && sudo make install

      - name: Build engine
        run: |
          make all
          mkdir -p ./artifacts
          cp scanoss ./artifacts/scanoss
          cp LICENSES/GPL-2.0-only.txt ./artifacts/LICENSE
          echo "Produced artifact at ${PWD}/artifacts/scanoss"

      - name: 'Tar files'
        run: tar czvf scanoss-engine-${{ github.ref_name }}-linux-amd64.tar.gz -C ./artifacts/ .

      - name: Prepare deb package
        id: build_deb
        run: |
          make prepare_deb_package
          echo "debpkg_file_name=$(ls *.deb)" >> $GITHUB_OUTPUT

      - name: Prepare rpm package
        run: |
          make prepare_rpm_package
          echo "rpmpkg_file_name=$(ls dist/rpm/RPMS/x86_64/*.rpm)" >> $GITHUB_OUTPUT

      - name: Show the artifacts
        # Items placed in /artifacts in the container will be in
        # ${PWD}/artifacts on the host.
        run: |
          ls -al "${PWD}/artifacts"
          ls -al "${PWD}"
          ls -al "${PWD}/dist/rpm/RPMS/x86_64/"
      
      - name: Create Draft Release ${{ github.ref_type }} - ${{ github.ref_name }}
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            ./**.tar.gz
            ./*.deb
            ./dist/rpm/RPMS/x86_64/*.rpm



      